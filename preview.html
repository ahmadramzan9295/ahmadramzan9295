<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmed Ramzan — GitHub CV Preview</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
    }
    .markdown-body {
      background-color: transparent;
    }
    .copy-banner {
      background: linear-gradient(135deg, #1f2937, #111827);
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="copy-banner">
    <div>
      <h3 style="margin: 0 0 4px 0; color: #38bdf8;">✨ GitHub Profile CV Ready</h3>
      <p style="margin: 0; font-size: 14px; color: #9ca3af;">This preview renders exactly how your <code>README.md</code> looks on your GitHub profile.</p>
    </div>
  </div>

  <article id="content" class="markdown-body"></article>

  <script>
    fetch('README.md')
      .then(res => res.text())
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(err => {
        console.error("Error loading markdown:", err);
      });
  </script>
</body>
</html>
